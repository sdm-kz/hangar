<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon.png" />
    <!-- interactive-widget: let the on-screen keyboard shrink the layout viewport (Chromium 108+),
         so the fixed-height app reflows above it instead of hiding its bottom composer. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Hangar</title>
    <!-- PWA: required so iOS Safari (16.4+) allows Web Push once the app is added to the Home Screen. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#0B1020" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- default, not black-translucent: with a see-through bar iOS 26 draws the clock over the page
         but can still report env(safe-area-inset-top) as 0 (WebKit 301994), burying the header.
         An opaque bar starts the page below it, and iOS colours it from the page's background.
         iOS reads this only when the app is added, so an installed copy must be re-added. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Hangar" />
    <script>
      // Apply the saved theme before render to avoid a flash. Default: light. The mode is light, dark
      // or system; the colours are the ones lib/theme.ts last resolved for each kind (a CSS custom
      // property per token), so a theme from the settings or the Themes dialog paints at once too.
      (function () {
        try {
          var mode = localStorage.getItem("hangar.theme");
          var dark =
            mode === "dark" ||
            (mode === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
          var vars = JSON.parse(localStorage.getItem("hangar.theme.vars") || "{}")[dark ? "dark" : "light"];
          for (var name in vars || {})
            if (/^--[a-z0-9-]+$/.test(name) && CSS.supports("color", vars[name]))
              document.documentElement.style.setProperty(name, vars[name]);
        } catch (e) {}
      })();
    </script>
    <script>
      // Belt and braces for the meta above: browsers that ignore interactive-widget (iOS Safari,
      // and Yandex on mobile) keep the layout viewport at full height and just draw the keyboard
      // over it, burying the message composer at the bottom of the app. Mirror the *visual*
      // viewport height into --app-height (consumed by html/body/#root in index.css) so the app
      // shrinks to the space above the keyboard instead. Multiplying by `scale` keeps pinch-zoom
      // out of it: zooming in shrinks visualViewport.height proportionally, and scaling it back
      // leaves the layout untouched.
      (function () {
        var vv = window.visualViewport;
        if (!vv) return;
        var apply = function () {
          var h = Math.round(vv.height * vv.scale);
          if (h > 0) document.documentElement.style.setProperty("--app-height", h + "px");
          // The keyboard covers the home indicator, so #root's bottom safe-area padding would only
          // leave a gap between the composer and the keys. iOS keeps innerHeight at full height
          // while the keyboard is up, so a visual viewport well short of it means a keyboard.
          document.documentElement.toggleAttribute("data-keyboard", window.innerHeight - h > 150);
        };
        vv.addEventListener("resize", apply);
        apply();
      })();
    </script>
    <script>
      // Chrome floors a border to whole device pixels, so on a fractional device pixel ratio -- any
      // of Windows' 125/150/175% display scalings -- the 1px asked for here comes out *one* device
      // pixel thin. A popup then lands at a fractional device position, that single pixel is split
      // across two, and neither is drawn solid: the line dissolves into the surface behind it. It
      // survives on whichever side happened to land near a whole pixel and vanishes on the other,
      // and it moves from side to side as the popup is resized -- which is what "the border is
      // hidden by white, sometimes left, sometimes right" was.
      //
      // Rounding the hairline up to a whole number of device pixels leaves at least one fully
      // covered pixel wherever the edge falls, which is what makes it a line again. ceil(dpr) is
      // the thinnest that holds: 1 device pixel at 100%, 2 at anything above it. Re-read whenever
      // the ratio changes -- a move to another monitor, or a browser zoom.
      (function () {
        var apply = function () {
          var dpr = window.devicePixelRatio || 1;
          document.documentElement.style.setProperty("--hairline", Math.ceil(dpr) / dpr + "px");
          try {
            matchMedia("(resolution: " + dpr + "dppx)").addEventListener("change", apply, {
              once: true,
            });
          } catch (e) {}
        };
        apply();
      })();
    </script>
    <script>
      // Width of a classic scrollbar, once, into --scrollbar-w. The overlay controls that park in
      // the corner of a scrolling pane (the zoom box) are positioned against the pane's padding
      // edge, which on Windows and Linux runs *under* the scrollbar track -- so `right: 12px` puts
      // them a couple of pixels on top of it. Measuring beats guessing here because the answer is
      // 0 wherever scrollbars overlay the content (macOS, and any touch device), and padding the
      // controls away from an edge that has nothing on it would just look like a mistake.
      (function () {
        var apply = function () {
          var probe = document.createElement("div");
          probe.style.cssText =
            "position:absolute;top:-9999px;width:100px;height:100px;overflow:scroll";
          document.body.appendChild(probe);
          document.documentElement.style.setProperty(
            "--scrollbar-w",
            probe.offsetWidth - probe.clientWidth + "px"
          );
          probe.remove();
        };
        if (document.body) apply();
        else document.addEventListener("DOMContentLoaded", apply);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
